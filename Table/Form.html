<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Form</title>
</head>
<body>
    <form action="./Task2.html">
        <fieldset>
            <legend>Login Form</legend>
            <label for="un">User Name:</label>
            <input type="text" id="un"/>
            <br> <br>
            <label for="pwd">Password:</label>
            <input type="password" id="pwd"/>

            <br> <br>

            <label for="">Age:</label>
            <input type="number">

            <br><br>

            <label for="">E-Mail:</label>
            <input type="email">
            <br><br>
            <label for="">Mobile Number</label>
            <input type="tel">
            <br><br>
            <label for="">Gender</label>
            <select name="" id="">
                <option value=""></option>
                <option value="">Male</option>
                <option value="">Female</option>
                <option value="">Others</option>
            </select>
            <br> <br>
            <label for=""> Select Your Fav Movie</label>
            <select name="" id="">
                <optgroup label="Vijay">
                <option value=""></option>
                <option value="">Bigil</option>
                <option value="">Theri</option>
                <option value="">Ghilli</option>
                <option value="">Jana nayagan</option>
                </optgroup>
                <optgroup label="Ajith">
                    <option value="">GBU</option>
                    <option value="">Billa</option>
                    <option value="">Mankatha</option>
                    <option value="">Vivegam</option>
                </optgroup>
            </select>

            <br>
            <br>

            <label for="">Languages Known:</label>
            <label for="">Tamil</label>
            <input type="checkbox">

            <label for="">English</label>
            <input type="checkbox">

            <label for="">Hindi</label>
            <input type="checkbox">

            <label for="">Telugu</label>
            <input type="checkbox">
            <br><br>


            <label for="">Eligible to drive:</label>

             <label for="">Lesser than 18</label>
            <input type="radio" name="bike">

            <br> <br>

            <label for="">Joining date:</label>
            <input type="date">
            <br><br>

            <label for="">Exit time:</label>
            <input type="time">
            <br><br>

            <label for="">Date with time:</label>
            <input type="datetime-local">
            <br><br>
            
            <label for="">Joing month:</label>
            <input type="month">
            <br><br>

            <label for="">Joing Week:</label>
            <input type="week">
            <br><br>

            <input type="Submit">
            <input type="Reset">
        

        </fieldset>
    </form>
</body>
</html>
