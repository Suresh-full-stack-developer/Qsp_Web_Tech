<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Creation</title>
    <style>
        h1{
            color: crimson;
        }
    </style>
</head>
<body>
    <h1>Avengers Details</h1>
   <table border="3" cellspacing="5" cellpadding="1" style="border-collapse: collapse;">
        <!--Another Way-->
        <!-- table border="1" cellspacing="5" cellpadding="1" rules="all" -->
        <tr>
        <thead>
            <th>Sl No</th>
            <th>Name</th>
            <th>Skill</th>
        </thead>
        </tr>

         <tfoot>
            <tr>
            <th colspan="2">All the details</th>
            <th> Correct</th>
        </tr>
        
        </tfoot>
        <tbody>
            <tr>
            <td>1</td>
            <td>Captain America</td>
            <td>Super Soldier</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Iron-Man</td>
            <td>Great Scientist</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Thor</td>
            <td>Thunder God</td>
        </tr>
        <tr>
            <td>4</td>
            <td>Spider-Man</td>
            <td>Spider Power</td>
        </tr>
        <tr>
            <td>5</td>
            <td>Scarlet Witch</td>
            <td>Devil</td>
        </tr>
        <tr>
            <td>6</td>
            <td>Doctor Strange</td>
            <td rowspan="2">Magic</td>
        </tr>
        <tr>
            <td>7</td>
            <td>Wanda</td>
        </tr>
        <tr>
            <td>8</td>
            <td>Groot</td>
            <td>Becoming Tree</td>
        </tr>
        </tbody>
    </table>
</body>

</html>
